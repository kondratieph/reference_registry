services:
  reference-registry-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: &environment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reference-registry
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres -d reference-registry' ]
      interval: 5s
      timeout: 5s
      retries: 10

  reference-registry-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      reference-registry-db:
        condition: service_healthy
    environment:
      <<: *environment
      APP_ENV: 'LOCAL_DOCKER'
      POSTGRES_HOST: reference-registry-db
      POSTGRES_PORT: 5432
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./:/opt/reference_registry/
      - /opt/reference_registry/venv
      - /opt/reference_registry/.git
      - /opt/reference_registry/.idea
    entrypoint:
      - ./entrypoint_local.sh

volumes:
  postgres_data:
